_format_version: "2.1"

services:
  - name: kong-status
    url: http://localhost:8001
    routes:
      - name: status-route
        paths:
          - /status
        strip_path: true
    plugins:
      - name: request-termination
        config:
          status_code: 200
          message: "OK"
          
  - name: authservice
    url: http://auth-service-alb.public:80
    routes:
      - name: auth-route
        paths:
          - /auth/v1
        strip_path: false
        preserve_host: false


  - name: userservice
    url: http://user-service-alb.public:80
    routes:
      - name: user-route
        paths:
          - /user/v1
        strip_path: false
        preserve_host: false
    plugins:
      - name: custom-auth
        config:
          auth_endpoint: http://auth-service-alb.public:80/auth/v1/ping

  - name: expenseservice
    url: http://expense-service-alb.public:80
    routes:
      - name: expense-route
        paths:
          - /expense/v1
        strip_path: false
        preserve_host: false
    plugins:
      - name: custom-auth
        config:
          auth_endpoint: http://auth-service-alb.public:80/auth/v1/ping

  - name: llmservice
    url: http://ds-service-alb.public:80
    routes:
      - name: llm-route
        paths:
          - /llm/v1
        strip_path: false
        preserve_host: false
    plugins:
      - name: custom-auth
        config:
          auth_endpoint: http://auth-service-alb.public:80/auth/v1/ping